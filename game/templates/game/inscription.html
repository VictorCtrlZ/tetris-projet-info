{% load static %}

<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <title>Inscription</title>
        <link rel="stylesheet" href="{% static 'game/css/auth.css' %}">
    </head>
    <body>
        <div class="container">
            <h1>Inscription</h1>
                {% if messages %}
                    {% for message in messages %}
                        <p class="message">{{ message }}</p>
                    {% endfor %}
                {% endif %}
            <form method="post">

                {% csrf_token %}
                <div class="form">
                    <label for="username">Login</label>
                    <input type="text" id="username" name="username" placeholder="Login" required>
                </div>
                <div class="form">
                    <label for="password">Mot de passe</label>
                    <input type="password" id="password" name="password" minlength="8" placeholder="Mot de passe" required>
                </div>

                <button type="submit">S'inscrire</button>
            </form>
            <p>Déjà un compte? <a href="{% url 'connexion' %}">Se connecter</a></p>
        </div>
    </body>
</html>
