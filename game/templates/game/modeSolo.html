{% load static %}

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mode solo</title>
    <link rel="stylesheet" href="{% static 'game/css/solo.css' %}">
    <link rel="icon" href="{% static 'game/images/logo.png' %}">
</head>
<body>
    <h1>Mode solo</h1>

    <div class="score-container">
        <h2>SCORE</h2>
        <p id="score">0</p>
    </div>

    <canvas id="tetris"></canvas>

    <div id="game-over" class="game-over">
        <div class="popup">
            <h2>Game over</h2>
            <button id="restart">Recommencer</button>
            <a href="{% url 'menu' %}">
                <button>Retourner au menu</button>
            </a>
        </div>
    </div>

    <script src="{% static 'game/js/solo.js' %}"></script>

</body>
</html>
