{% load static %}

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mode solo</title>
    <link rel="stylesheet" href="{% static 'game/css/solo.css' %}">
    <link rel="icon" href="{% static 'game/images/logo.png' %}">
</head>
<body>
    <h1>Mode solo</h1>

    <div class="game-controls">
        <button id="pause" class="game-button">Pause</button>
        <a href="{% url 'menu' %}">
            <button class="game-button">Retour au menu</button>
        </a>
    </div>

    <div class="next-piece-container">
        <h2>PIECE SUIVANTE</h2>
        <canvas id="next-piece" width="120" height="120"></canvas>
    </div>

    <div class="score-container">
        <h2>SCORE</h2>
        <p id="score">0</p>
    </div>

    <div class="timer-container">
        <h2>TEMPS</h2>
        <p id="timer">00:00</p>
    </div>

    <canvas id="tetris"></canvas>

    <div id="game-over" class="game-over">
        <div class="popup">
            <h2>Game over</h2>
            <button id="restart">Recommencer</button>
            <a href="{% url 'menu' %}">
                <button>Retourner au menu</button>
            </a>
        </div>
    </div>

    <div id="pause-menu" class="game-over">
        <div class="popup">
            <h2>Pause</h2>
            <button id="resume">Reprendre</button>
            <a href="{% url 'menu' %}">
                <button>Retour au menu</button>
            </a>
        </div>
    </div>

    <script src="{% static 'game/js/solo.js' %}"></script>

</body>
</html>
