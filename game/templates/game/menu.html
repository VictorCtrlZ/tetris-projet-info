{% load static %}

<!DOCTYPE html>

<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Menu</title>
        <link rel="stylesheet" href="{% static 'game/css/menu.css' %}">
        <link rel="icon" href="{% static 'game/images/logo.png' %}">

    </head>
    <body>
        <div class="logout-button">
            <form method="post" action="{% url 'deconnexion' %}">
                {% csrf_token %}
                <button type="submit">
                    <img src="{% static 'game/images/logout.png' %}" alt="Déconnexion">
                </button>
            </form>
        </div>

        <div class="dashboard-button">
            <a href="{% url 'scoreboard' %}">
                <img src="{% static 'game/images/trophee.png' %}" alt="Scoreboard">
            </a>
        </div>

        <h1>Choisissez votre mode de jeu</h1>
        <br>
        <div class="menu-buttons">
            <a href="{% url 'modeSolo' %}">
                <button class="menu-button">Solo</button>
            </a>
            <a href="{% url 'modeDuel' %}">
                <button class="menu-button">Duel</button>
            </a>
            <a href="{% url 'modeCollaboratif' %}">
                <button class="menu-button">Collaboratif</button>
            </a>
        </div>
    </body>
</html>
