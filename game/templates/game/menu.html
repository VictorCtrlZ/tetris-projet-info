{% load static %}

<!DOCTYPE html>

<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Menu</title>
        <link rel="stylesheet" href="{% static 'game/css/menu.css' %}">
        <link rel="icon" href="{% static 'game/images/logo.png' %}">

    </head>
    <body>
        <div class="rules-button">
            <a href="{% url 'regles' %}">
                <img src="{% static 'game/images/rules.png' %}" alt="Rules">
            </a>
        </div>

        <div class="dashboard-button">
            <a href="{% url 'scoreboard' %}">
                <img src="{% static 'game/images/trophee.png' %}" alt="Scoreboard">
            </a>
        </div>

        <h1>Choisissez votre mode de jeu</h1>
        <br>
        <div class="menu-buttons">
            <a href="{% url 'modeSolo' %}">
                <button class="menu-button">Solo</button>
            </a>
            <a href="{% url 'modeDuel' %}">
                <button class="menu-button">Duel</button>
            </a>
            <a href="{% url 'modeCollaboratif' %}">
                <button class="menu-button">Collaboratif</button>
            </a>
        </div>
        <div class="about-us-button">
            <a href="{% url 'aboutus' %}">
                <img src="{% static 'game/images/about-us.png' %}" alt="About us">
            </a>
        </div>
    </body>
</html>
